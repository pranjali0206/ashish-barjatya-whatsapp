<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Welcome | Ashish Barjatya Associates</title>
  <meta name="description" content="Welcome to Ashish Barjatya Associates. Residential plots in Omaxe and Godrej townships across Indore. Chat with us on WhatsApp or call +91 93000 24141." />
  <meta name="theme-color" content="#0B1F5C" />
  <link rel="icon" href="img/aba-logo.jpeg" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Ashish Barjatya Associates" />
  <meta property="og:title" content="Welcome to Ashish Barjatya Associates" />
  <meta property="og:description" content="Residential plots in Omaxe and Godrej townships across Indore. Authorised channel partner for 20 years." />
  <meta property="og:image" content="img/township.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Mukta:wght@700&family=Sora:wght@600&display=swap" />
  <style>
    :root{--navy:#0B1F5C;--navy-lift:#17358C;--gold:#E0B43C;--green:#25D366;--green-hover:#3BE07A;--green-ink:#052E16;--white:#FFFFFF;--head:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--navy);color:var(--white);font-family:var(--body);-webkit-font-smoothing:antialiased}
    a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

    .splash{display:grid;place-items:center;min-height:100vh;min-height:100svh;padding:16px 20px calc(16px + env(safe-area-inset-bottom));text-align:center;background:radial-gradient(circle at 50% 45%,var(--navy-lift) 0%,var(--navy) 75%)}
    .logo{display:block;width:clamp(128px,20vmin,168px);height:auto;aspect-ratio:1;margin-inline:auto;padding:10px;border-radius:50%;object-fit:contain;background:var(--white);box-shadow:0 0 0 3px var(--gold)}
    h1{margin:24px 0 0;font:600 clamp(30px,5.4vw,54px)/1.12 var(--head);letter-spacing:-.03em;text-wrap:balance}
    .hindi{margin:12px 0 0;font:700 clamp(20px,2.6vw,28px)/1.35 'Mukta',var(--body);color:var(--gold)}
    .offer{margin:22px 0 0;font:500 clamp(16px,1.6vw,19px)/1.45 var(--body);text-wrap:balance}

    .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:min(100%,320px);min-height:54px;margin-top:16px;padding:0 26px;border-radius:999px;font:600 16px/1.2 var(--head);text-decoration:none;white-space:nowrap;transition:background .25s,transform .25s}
    .btn svg{width:22px;height:22px;flex:none}
    .btn:hover{transform:translateY(-2px)}
    .btn-wa{background:var(--green);color:var(--green-ink)}
    .btn-wa:hover{background:var(--green-hover)}

    /* phones held sideways: keep everything on one screen */
    @media(max-height:480px){
      .logo{width:96px;padding:6px}
      h1{margin-top:14px}
      .hindi{margin-top:6px}
      .offer{margin-top:10px}
      .btn{margin-top:12px}
    }
    @media(prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover{transform:none}}
  </style>
</head>
<body>
  <main class="splash">
    <div class="brand">
      <img class="logo" src="img/aba-logo.jpeg" alt="Ashish Barjatya Associates logo" width="168" height="168" />
      <h1>Ashish Barjatya Associates</h1>
      <p class="hindi" lang="hi">जहाँ सपनों को उनका पता मिलता है</p>
      <p class="offer">Get Brochure, Price &amp; Site&nbsp;Visit&nbsp;&mdash; Instantly On WhatsApp</p>
      <a class="btn btn-wa" href="https://wa.me/919300024141?text=Hello%2C%20I%20would%20like%20to%20know%20about%20plots%20in%20the%20Omaxe%20and%20Godrej%20townships%20in%20Indore.">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22c5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2m0 1.67c4.56 0 8.24 3.68 8.24 8.24s-3.68 8.24-8.24 8.24c-1.5 0-2.97-.4-4.25-1.17l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.36c0-4.56 3.68-8.24 8.24-8.24m-3.4 4.4c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1s.9 2.43 1.03 2.6c.13.17 1.77 2.7 4.3 3.78 2.1.84 2.52.67 2.98.63.46-.04 1.48-.6 1.69-1.19.21-.59.21-1.09.15-1.19-.06-.1-.23-.17-.48-.29-.25-.13-1.48-.73-1.71-.81-.23-.08-.4-.13-.56.12-.17.25-.65.81-.8.98-.15.17-.29.19-.54.06-.25-.12-1.06-.39-2.01-1.24-.74-.66-1.24-1.48-1.39-1.73-.15-.25-.02-.38.11-.51.11-.11.25-.29.38-.44.12-.15.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.12-.56-1.35-.77-1.85-.2-.48-.41-.42-.56-.43h-.5z" /></svg>
        Chat on WhatsApp
      </a>
    </div>
  </main>
</body>
</html>
